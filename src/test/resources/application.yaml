spring:
  datasource:
    url: jdbc:h2:mem:flychat;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  data:
    mongodb:
      uri: mongodb://localhost:27017/fly-chat

app:
  security:
    jwt:
      secret: test-secret-test-secret-test-secret-test-secret
      issuer: fly-chat-test
      access-token-ttl: 1h
